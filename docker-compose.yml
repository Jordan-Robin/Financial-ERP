services:
  db:
    image: postgres:16
    container_name: financial-erp-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit
    container_name: financial-erp-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: