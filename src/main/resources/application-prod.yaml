spring:
  mail:
    host: # ${SMTP_HOST}
    port: # ${SMTP_PORT}
    username: # ${SMTP_USERNAME}
    password: # ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  base-url: https://financial-erp.com