spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # TODO remplacer par validate
    show-sql: true

  flyway:
    placeholders:
      SUPER_USER_EMAIL: ${FLYWAY_ADMIN_USER_EMAIL}
      SUPER_USER_PASSWORD: ${FLYWAY_ADMIN_USER_PASSWORD}
    locations:
      - classpath:db/migration/public

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem